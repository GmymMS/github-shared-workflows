name: Docker Deploy

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
        description: "Docker image name without registry prefix (e.g. admio)"
      container-name:
        required: true
        type: string
        description: "Docker container name on VPS (e.g. admio-app)"
      vps-app-dir:
        required: true
        type: string
        description: "App directory on VPS (e.g. ~/apps/admio)"
      health-check-path:
        required: false
        type: string
        default: "/api/health"
        description: "HTTP path for post-deploy health check"
      host-port:
        required: false
        type: string
        default: "3005"
        description: "Host port the container is mapped to (for health check curl)"
      compose-file:
        required: false
        type: string
        default: "docker-compose.prod.yml"
        description: "Docker Compose file name inside vps-app-dir"
      node-version:
        required: false
        type: string
        default: "22"
      run-migrations:
        required: false
        type: boolean
        default: false
        description: "Run 'npx prisma migrate deploy' inside the container after health check passes"
      run-seed:
        required: false
        type: boolean
        default: false
        description: "Run 'npx prisma db seed' inside the container after migrations (QA only)"
      app-version:
        required: false
        type: string
        default: ""
        description: "Version identifier injected as NEXT_PUBLIC_APP_VERSION Docker build arg"
      sentry-org:
        required: false
        type: string
        default: ""
        description: "Sentry organization slug for release event (skipped if empty)"
      sentry-project:
        required: false
        type: string
        default: ""
        description: "Sentry project slug for release event (skipped if empty)"
      environment:
        required: false
        type: string
        default: ""
        description: "GitHub environment name for secret scoping (e.g. production, staging)"
      build:
        required: false
        type: boolean
        default: true
        description: "Build & push the image. Set false to PROMOTE an already-built sha-<commit> tag (skips checkout build deps, npm ci/test, docker build)."
      run-tests:
        required: false
        type: boolean
        default: true
        description: "Run 'npm test' before building. Set false when tests already ran in an upstream PR gate."
    secrets:
      VPS_HOST:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_USERNAME:
        required: true
      DOPPLER_TOKEN:
        required: true
      GHCR_TOKEN:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false
      GH_NPM_TOKEN:
        required: true
      NEXT_PUBLIC_SENTRY_DSN:
        required: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: ${{ inputs.environment }}
    # Bez tego job leci na domyślnych 360 min. Na self-hosted runnerze (jeden na
    # organizację) zawieszony deploy blokuje WSZYSTKO, co czeka w kolejce — crony
    # też. Incydent 2026-08-04: push do GHCR stanął bez ruchu i bez błędu na ~21 min
    # (obraz był już zbudowany lokalnie), a za jobem ustawiły się crony. Limit
    # zamienia cichy zwis w czytelną porażkę i zwalnia runnera.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: ${{ inputs.build }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        if: ${{ inputs.build }}
        run: npm ci
        env:
          GH_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN }}

      - name: Run tests
        if: ${{ inputs.build && inputs.run-tests }}
        run: npm test

      - name: Set image tag
        id: tag
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        if: ${{ inputs.build }}
        # Węższy limit niż job: to TU zwisa push do rejestru, a reszta joba (deploy
        # na VPS, migracje, seed, health-check) ma zostać z zapasem czasu.
        timeout-minutes: 30
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # `pull: true` — ZAWSZE sięgnij po świeży obraz bazowy zamiast brać go z cache.
          #
          # Bez tego łatka bezpieczeństwa w Dockerfile przestaje działać w dniu, w którym jej
          # warstwa wpadnie do cache — czyli po pierwszym zbudowaniu. Obraz admio ma
          # `RUN apk upgrade --no-cache libcrypto3 libssl3` w obu etapach, a w logu builda stoi
          # `#8 CACHED`: `--no-cache` to flaga APK (nie trzymaj indeksu pakietów), nie Dockera,
          # więc warstwa liczy się z samej treści instrukcji i ta się nie zmienia. Łatka chroniła
          # wyłącznie przed podatnościami znanymi w dniu, w którym powstała ta warstwa.
          # Wyszło dopiero na CVE-2026-14456 w openssl (GmymMS/admio#533) — wcześniej wynik był
          # nieodróżnialny od poprawnego.
          #
          # Świeży digest obrazu bazowego unieważnia CAŁY łańcuch warstw, więc `apk upgrade`
          # wykonuje się realnie, a przy okazji wchodzą łatki pakietów, których nie wymieniliśmy
          # z imienia. Gdy baza się nie zmieniła, cache działa jak dotąd — koszt jest tylko wtedy,
          # gdy faktycznie jest co pobrać.
          pull: true
          secrets: |
            GH_NPM_TOKEN=${{ secrets.GH_NPM_TOKEN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ inputs.app-version }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENV=${{ inputs.environment }}
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:latest

      - name: Encode compose file
        id: compose
        run: echo "b64=$(base64 -w 0 ${{ inputs.compose-file }})" >> $GITHUB_OUTPUT

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          COMPOSE_B64: ${{ steps.compose.outputs.b64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22022
          envs: DOPPLER_TOKEN,COMPOSE_B64
          script: |
            set -e
            cd ${{ inputs.vps-app-dir }}

            # Sync compose file from repo
            echo "$COMPOSE_B64" | base64 -d > ${{ inputs.compose-file }}

            # Pull the image. In promote mode (build:false) this tag was built by
            # an earlier (QA) run; fail loudly if it is missing (e.g. pruned from
            # the registry) rather than silently deploying a stale/different image.
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            if ! docker pull ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}; then
              echo "::error::Image ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }} not found in registry — cannot deploy/promote. If promoting, the QA-built image may have been pruned."
              exit 1
            fi
            docker tag ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }} \
                       ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:latest

            # Deploy via Doppler (injects all secrets at runtime)
            doppler run -- docker compose -f ${{ inputs.compose-file }} up -d --remove-orphans

            # Health check (5 retries x 10s)
            for i in 1 2 3 4 5; do
              sleep 10
              if curl -sf http://localhost:${{ inputs.host-port }}${{ inputs.health-check-path }}; then
                echo "Health check passed on attempt $i"
                break
              fi
              if [ $i -eq 5 ]; then
                echo "Health check failed after 5 attempts — rolling back"
                docker compose -f ${{ inputs.compose-file }} restart ${{ inputs.container-name }}
                exit 1
              fi
            done

            # Run Prisma migrations if enabled
            # Use docker exec (not docker compose exec) to avoid compose
            # re-evaluating ${POSTGRES_PASSWORD} without Doppler, which
            # produces a malformed DATABASE_URL and breaks the migration.
            if [ "${{ inputs.run-migrations }}" = "true" ]; then
              echo "Running database migrations..."
              CONTAINER_ID=$(docker compose -f ${{ inputs.compose-file }} ps -q ${{ inputs.container-name }})
              if ! docker exec "$CONTAINER_ID" node node_modules/prisma/build/index.js migrate deploy; then
                echo "Migration failed — rolling back"
                docker compose -f ${{ inputs.compose-file }} restart ${{ inputs.container-name }}
                exit 1
              fi
              echo "Migrations applied successfully"
            fi

            # Seed QA database if enabled (never runs in production)
            if [ "${{ inputs.run-seed }}" = "true" ]; then
              echo "Seeding QA database..."
              CONTAINER_ID=$(docker compose -f ${{ inputs.compose-file }} ps -q ${{ inputs.container-name }})
              docker exec "$CONTAINER_ID" npx prisma db seed
              echo "Seed complete"
            fi

            # Prune old images (keep 3 most recent)
            docker images ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }} \
              --format "{{.ID}} {{.CreatedAt}}" | sort -k2 -r | tail -n +4 | awk '{print $1}' | \
              xargs -r docker rmi || true

            echo "Deploy complete: ${{ steps.tag.outputs.tag }}"

      - name: Create Sentry release
        if: ${{ inputs.app-version != '' && inputs.sentry-org != '' && inputs.sentry-project != '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "Sentry release skipped — SENTRY_AUTH_TOKEN not set"
            exit 0
          fi
          curl -sf -X POST "https://sentry.io/api/0/organizations/${{ inputs.sentry-org }}/releases/" \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${{ inputs.app-version }}\",\"projects\":[\"${{ inputs.sentry-project }}\"],\"ref\":\"$GITHUB_SHA\"}" \
            || echo "Sentry release API call failed — continuing"
          echo "Sentry release created: ${{ inputs.app-version }}"
