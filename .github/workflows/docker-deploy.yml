name: Docker Deploy

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
        description: "Docker image name without registry prefix (e.g. admio)"
      container-name:
        required: true
        type: string
        description: "Docker container name on VPS (e.g. admio-app)"
      vps-app-dir:
        required: true
        type: string
        description: "App directory on VPS (e.g. ~/apps/admio)"
      health-check-path:
        required: false
        type: string
        default: "/api/health"
        description: "HTTP path for post-deploy health check"
      host-port:
        required: false
        type: string
        default: "3005"
        description: "Host port the container is mapped to (for health check curl)"
      compose-file:
        required: false
        type: string
        default: "docker-compose.prod.yml"
        description: "Docker Compose file name inside vps-app-dir"
      node-version:
        required: false
        type: string
        default: "22"
      run-migrations:
        required: false
        type: boolean
        default: false
        description: "Run 'npx prisma migrate deploy' inside the container after health check passes"
      run-seed:
        required: false
        type: boolean
        default: false
        description: "Run 'npx prisma db seed' inside the container after migrations (QA only)"
      app-version:
        required: false
        type: string
        default: ""
        description: "Version identifier injected as NEXT_PUBLIC_APP_VERSION Docker build arg"
      sentry-org:
        required: false
        type: string
        default: ""
        description: "Sentry organization slug for release event (skipped if empty)"
      sentry-project:
        required: false
        type: string
        default: ""
        description: "Sentry project slug for release event (skipped if empty)"
      environment:
        required: false
        type: string
        default: ""
        description: "GitHub environment name for secret scoping (e.g. production, staging)"
    secrets:
      VPS_HOST:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_USERNAME:
        required: true
      DOPPLER_TOKEN:
        required: true
      GHCR_TOKEN:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false
      GH_NPM_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          GH_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN }}

      - name: Run tests
        run: npm test

      - name: Set image tag
        id: tag
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          secrets: |
            GH_NPM_TOKEN=${{ secrets.GH_NPM_TOKEN }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ inputs.app-version }}
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:latest

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22022
          source: ${{ inputs.compose-file }}
          target: ${{ inputs.vps-app-dir }}/

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22022
          envs: DOPPLER_TOKEN
          script: |
            set -e
            cd ${{ inputs.vps-app-dir }}

            # Pull new image
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}
            docker tag ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }} \
                       ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:latest

            # Deploy via Doppler (injects all secrets at runtime)
            doppler run -- docker compose -f ${{ inputs.compose-file }} up -d --remove-orphans

            # Health check (5 retries x 10s)
            for i in 1 2 3 4 5; do
              sleep 10
              if curl -sf http://localhost:${{ inputs.host-port }}${{ inputs.health-check-path }}; then
                echo "Health check passed on attempt $i"
                break
              fi
              if [ $i -eq 5 ]; then
                echo "Health check failed after 5 attempts — rolling back"
                docker compose -f ${{ inputs.compose-file }} restart ${{ inputs.container-name }}
                exit 1
              fi
            done

            # Run Prisma migrations if enabled
            # Use docker exec (not docker compose exec) to avoid compose
            # re-evaluating ${POSTGRES_PASSWORD} without Doppler, which
            # produces a malformed DATABASE_URL and breaks the migration.
            if [ "${{ inputs.run-migrations }}" = "true" ]; then
              echo "Running database migrations..."
              CONTAINER_ID=$(docker compose -f ${{ inputs.compose-file }} ps -q ${{ inputs.container-name }})
              if ! docker exec "$CONTAINER_ID" node node_modules/prisma/build/index.js migrate deploy; then
                echo "Migration failed — rolling back"
                docker compose -f ${{ inputs.compose-file }} restart ${{ inputs.container-name }}
                exit 1
              fi
              echo "Migrations applied successfully"
            fi

            # Seed QA database if enabled (never runs in production)
            if [ "${{ inputs.run-seed }}" = "true" ]; then
              echo "Seeding QA database..."
              CONTAINER_ID=$(docker compose -f ${{ inputs.compose-file }} ps -q ${{ inputs.container-name }})
              docker exec "$CONTAINER_ID" npx prisma db seed
              echo "Seed complete"
            fi

            # Prune old images (keep 3 most recent)
            docker images ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }} \
              --format "{{.ID}} {{.CreatedAt}}" | sort -k2 -r | tail -n +4 | awk '{print $1}' | \
              xargs -r docker rmi || true

            echo "Deploy complete: ${{ steps.tag.outputs.tag }}"

      - name: Create Sentry release
        if: ${{ inputs.app-version != '' && inputs.sentry-org != '' && inputs.sentry-project != '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "Sentry release skipped — SENTRY_AUTH_TOKEN not set"
            exit 0
          fi
          curl -sf -X POST "https://sentry.io/api/0/organizations/${{ inputs.sentry-org }}/releases/" \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${{ inputs.app-version }}\",\"projects\":[\"${{ inputs.sentry-project }}\"],\"ref\":\"$GITHUB_SHA\"}" \
            || echo "Sentry release API call failed — continuing"
          echo "Sentry release created: ${{ inputs.app-version }}"
