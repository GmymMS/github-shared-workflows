name: Docker Deploy

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
        description: "Docker image name without registry prefix (e.g. admio)"
      container-name:
        required: true
        type: string
        description: "Docker container name on VPS (e.g. admio-app)"
      vps-app-dir:
        required: true
        type: string
        description: "App directory on VPS (e.g. ~/apps/admio)"
      health-check-path:
        required: false
        type: string
        default: "/api/health"
        description: "HTTP path for post-deploy health check"
      node-version:
        required: false
        type: string
        default: "22"
      run-migrations:
        required: false
        type: boolean
        default: false
        description: "Run 'npx prisma migrate deploy' inside the container after health check passes"
      environment:
        required: false
        type: string
        default: ""
        description: "GitHub environment name for secret scoping (e.g. production, staging)"
    secrets:
      VPS_HOST:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_USERNAME:
        required: true
      DOPPLER_TOKEN:
        required: true
      GHCR_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set image tag
        id: tag
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22022
          script: |
            set -e
            cd ${{ inputs.vps-app-dir }}

            # Pull new image
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}
            docker tag ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }} \
                       ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }}:latest

            # Deploy via Doppler (injects all secrets at runtime)
            doppler run -- docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Health check (5 retries x 10s)
            for i in 1 2 3 4 5; do
              sleep 10
              if curl -sf http://localhost:3005${{ inputs.health-check-path }}; then
                echo "Health check passed on attempt $i"
                break
              fi
              if [ $i -eq 5 ]; then
                echo "Health check failed after 5 attempts — rolling back"
                docker compose -f docker-compose.prod.yml restart ${{ inputs.container-name }}
                exit 1
              fi
            done

            # Run Prisma migrations if enabled (FR-022)
            if [ "${{ inputs.run-migrations }}" = "true" ]; then
              echo "Running database migrations..."
              if ! docker compose -f docker-compose.prod.yml exec -T ${{ inputs.container-name }} ./node_modules/.bin/prisma migrate deploy; then
                echo "Migration failed — rolling back"
                docker compose -f docker-compose.prod.yml restart ${{ inputs.container-name }}
                exit 1
              fi
              echo "Migrations applied successfully"
            fi

            # Prune old images (keep 3 most recent)
            docker images ghcr.io/${{ steps.tag.outputs.owner }}/${{ inputs.image-name }} \
              --format "{{.ID}} {{.CreatedAt}}" | sort -k2 -r | tail -n +4 | awk '{print $1}' | \
              xargs -r docker rmi || true

            echo "Deploy complete: ${{ steps.tag.outputs.tag }}"
